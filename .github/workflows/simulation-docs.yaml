name: "simulation-docs"

env:
  ALLOWED_URIS: "https://github.com https://api.github.com"
  TRUSTED_PUBLIC_KEYS: "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ="
  SUBSTITUTERS: "https://cache.nixos.org/ https://cache.iog.io"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  pull_request:
    paths:
      - "simulation/docs/**"
  push:
    branches:
      - main
    paths:
      - "simulation/docs/**"

jobs:

  sim-docs:
    name: Build documents via Ubuntu
    if: true
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
    - name: 🛠️ Install system dependencies
      run: sudo apt-get install -y texlive-full gnuplot python3-pygments
    - name: 🏗️ network-spec.pdf
      run: |
        cd simulation/docs/network-spec/
        make
    - name: 🏗️ sim-realism.pdf
      run: |
        cd simulation/docs/
        make

  sim-docs-via-nix:
    if: false
    name: Build documents via Nix
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
    - name: 🛠️ Install Nix
      # Keep the action new enough that its default Nix is >= 2.27.0: the
      # pinned ouroboros-consensus flake input uses `inputs.self.submodules`
      # (Nix 2.27.0+, https://github.com/NixOS/nix/pull/12421); older Nix
      # fails evaluating this flake with "unexpected flake input attribute
      # 'submodules'". v31.11.0 installs Nix 2.35.1 by default.
      uses: cachix/install-nix-action@v31.11.0
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          allowed-uris = ${{ env.ALLOWED_URIS }}
          trusted-public-keys = ${{ env.TRUSTED_PUBLIC_KEYS }}
          substituters = ${{ env.SUBSTITUTERS }}
          experimental-features = nix-command flakes
          accept-flake-config = true
    - name: 🏗️ network-spec.pdf
      run: |
        nix build --show-trace .#networkSpec
    - name: 🏗️ sim-realism.pdf
      run: |
        nix build --show-trace .#simRealism

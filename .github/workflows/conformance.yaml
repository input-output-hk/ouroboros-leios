name: "conformance"

env:
  ALLOWED_URIS: "https://github.com https://api.github.com"
  TRUSTED_PUBLIC_KEYS: "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ="
  SUBSTITUTERS: "https://cache.nixos.org/ https://cache.iog.io"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  pull_request:
    paths:
      - "leios-trace-hs/**"
      - "leios-trace-verifier/**"
  push:
    branches:
      - main
    paths:
      - "leios-trace-hs/**"
      - "leios-trace-verifier/**"

jobs:

  trace-verifier:
    name: Leios trace verifier
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
    - name: 🛠️ Install Nix
      # Keep the action new enough that its default Nix is >= 2.27.0: the
      # pinned ouroboros-consensus flake input uses `inputs.self.submodules`
      # (Nix 2.27.0+, https://github.com/NixOS/nix/pull/12421); older Nix
      # fails evaluating this flake with "unexpected flake input attribute
      # 'submodules'". v31.11.0 installs Nix 2.35.1 by default.
      uses: cachix/install-nix-action@v31.11.0
      with:
        nix_path: nixpkgs=channel:nixos-24.05
        extra_nix_config: |
          allowed-uris = ${{ env.ALLOWED_URIS }}
          trusted-public-keys = ${{ env.TRUSTED_PUBLIC_KEYS }}
          substituters = ${{ env.SUBSTITUTERS }}
          experimental-features = nix-command flakes
          accept-flake-config = true
    - name: 🏗️ Build trace verifier
      run: |
        nix build --show-trace .#linear-leios-trace-verifier
    - name: 🧪 Test trace verifier
      run: |
        nix run --show-trace .#test-trace-verifier
    - name: 🔬 Check example trace
      run: |
        nix run .#ols -- \
          sim leios \
          --leios-config-file data/simulation/config.default.yaml \
          --topology-file data/simulation/topo-default-100.yaml \
          --conformance-events \
          --shared-log-format JSON \
          --output-seconds 30 \
          --output-file sim.log
        nix run .#linear-leios-trace-verifier -- \
          --config-file data/simulation/config.default.yaml \
          --topology-file data/simulation/topo-default-100.yaml \
          --trace-file sim.log \
          --idSut 0 \
        || true   # FIXME: Remove when simulations conform to spec.

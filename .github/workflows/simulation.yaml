name: "simulation"

on:
  pull_request:
    paths:
      - "cabal.project"
      - "data/**"
      - "simulation/**"
      - "leios-trace-hs/**"
      - "analysis/sims/trace-processor/**"
  push:
    branches:
      - main
    paths:
      - "cabal.project"
      - "data/**"
      - "simulation/**"
      - "leios-trace-hs/**"
      - "analysis/sims/trace-processor/**"

jobs:
  simulation-test:
    name:
      "simulation: Test on ${{ matrix.os }} with GHC ${{ matrix.ghc-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
        ghc-version: ["9.10.1"]
    env:
      # Build/test only the packages this workflow actually cares about, by
      # name, instead of `all` (which would also pull in ouroboros-network,
      # gtk2hs, and deltaq's own test/exe components — see the "Use
      # cabal.project.ci-simulation" step below for why the Cardano stack
      # itself isn't even an option here).
      PACKAGES: ouroboros-leios-sim leios-trace-hs trace-processor leios-deltaq betti0
      # Unlike `cabal build`, `cabal test` errors on a named target that has
      # no test suite (whereas `test all` silently skips it), so this list
      # is narrower. Add a package here once it grows a test suite.
      TEST_PACKAGES: ouroboros-leios-sim

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Use cabal.project.ci-simulation (no Cardano stack)
        # cabal.project vendors cardano-api/cardano-ledger/ouroboros-consensus
        # via source-repository-package for the Nix-driven trace-verifier
        # build. cabal always solves *every* local package regardless of the
        # requested build target — so as long as those are part of the
        # project at all, `cabal build` (even scoped to $PACKAGES) tries to
        # solve them too and fails, since cardano-crypto-praos needs IOG's
        # patched libsodium via pkg-config, which only the Nix build
        # provides:
        #
        #   Error: [Cabal-7107]
        #   Could not resolve dependencies:
        #   [__0] trying: cardano-api-11.0.0.0 (user goal)
        #   ...
        #   [__2] rejecting: cardano-crypto-praos-2.2.2.0 (conflict:
        #         pkg-config package libsodium-any, not found in the
        #         pkg-config database)
        #
        # cabal.project.ci-simulation mirrors cabal.project but omits those
        # entries entirely, so they're never part of the project to solve.
        run: cp cabal.project.ci-simulation cabal.project

      - name: 🛠️ Install GHC ${{ matrix.ghc-version }}
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc-version }}
          # Defaults, added for clarity:
          cabal-version: "latest"
          cabal-update: true

      - name: 🛠️ Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y graphviz libpango1.0-dev libgtk-3-dev

      - name: 🛠️ Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz gtk+3 pango

      - name: 🛠️ Configure
        run: |
          # Not `cabal configure --enable-tests ...`: that command doesn't
          # accept a target list and (per its own --help) unconditionally
          # "checks that there is a consistent set of dependencies for the
          # project as a whole" — i.e. it solves for every local package
          # even though we only ever build/test $PACKAGES below. Write the
          # same settings it would have written to cabal.project.local
          # ourselves instead.
          cat > cabal.project.local << 'EOF'
          tests: True
          benchmarks: True
          documentation: False

          package *
            documentation: False
          EOF
          cabal build $PACKAGES --dry-run
        # The last step generates dist-newstyle/cache/plan.json for the cache key.

      - name: 💾➤ Restore dependency cache
        uses: actions/cache/restore@v4
        id: cache
        env:
          key:
            ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version
            }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key:
            ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json')
            }}
          restore-keys: ${{ env.key }}-

      - name: 🛠️ Install Cabal dependencies
        # If we had an exact cache hit, the dependencies will be up to date.
        if: steps.cache.outputs.cache-hit != 'true'
        run: cabal build $PACKAGES --only-dependencies

      # Cache dependencies already here, so that we do not have to rebuild them should the subsequent steps fail.
      - name: ➤💾 Save dependency cache
        uses: actions/cache/save@v4
        # If we had an exact cache hit, trying to save the cache would error because of key clash.
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: 🏗️ Build
        run: cabal build $PACKAGES

      - name: 🏗️ Test
        run: cabal test $TEST_PACKAGES

  simulation-hlint:
    name: "Check with HLint"
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up HLint
        uses: haskell-actions/hlint-setup@v2

      - name: 🛠️ Run HLint
        uses: haskell-actions/hlint-run@v2
        with:
          path: simulation/
          fail-on: warning

  simulation-fourmolu:
    name: "Check with fourmolu"
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Run fourmolu
        uses: haskell-actions/run-fourmolu@v11
        with:
          version: "0.19.0.1"

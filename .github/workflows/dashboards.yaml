name: dashboards

on:
  pull_request:
    paths:
      - "demo/proto-devnet/config/dashboards/**"
      - "demo/proto-devnet/scripts/check-dashboards.sh"
      - ".github/workflows/dashboards.yaml"
  push:
    branches:
      - main
    paths:
      - "demo/proto-devnet/config/dashboards/**"
      - "demo/proto-devnet/scripts/check-dashboards.sh"
      - ".github/workflows/dashboards.yaml"

jobs:
  check-dashboards:
    name: "Check"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Only proto-devnet's dashboards. They are also provisioned by
      # cardano-playground from this repo, so they have to stay portable; the
      # other Grafana JSON here is local to its own stack.
      - name: Check proto-devnet dashboard uids, ids, datasources and refresh
        run: bash demo/proto-devnet/scripts/check-dashboards.sh

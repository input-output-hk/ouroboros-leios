# Dozen-devnet: three block producers, each with three private relays,
# the nine relays fully meshed. Matches demo/dozen-devnet (run.sh).
#
# Node names are the process-compose process names, which is what the
# Loki `process` label carries and how the visualiser keys nodes.
#
# Locations are mock European IXP cities, chosen so pairwise distance
# implies an RTT near the uniform 20ms (DELAY=10ms each way) the devnet
# actually applies with tc. Latency below is the real configured value, not
# derived from the coordinates.
#
# Bandwidth is an approximation, deliberately. run.sh rate-limits each node's
# single uplink (RATE=50Mbps) and tc shares that dynamically across whichever
# peers are transmitting; this format can only state a figure per link. So each
# entry carries the *producer's* nominal share -- 50Mbps divided equally by its
# peer count -- because the entry describes the producer -> consumer direction
# and egress is what RATE caps:
#
#   a block producer has 3 peers  ->  2083333 B/s per link
#   a relay has 9 peers           ->   694444 B/s per link
#
# Two known errors follow from that. An equal split understates a link whenever
# the node's other peers are idle (bursty EB traffic is exactly that), and the
# figure is per-direction, so a bp <-> relay link is asymmetric here by design.
# Modelling this properly needs a per-node uplink capacity in the schema.
nodes:
  bp1:
    # Dublin
    stake: 30000000000000
    location:
      - 53.3498
      - -6.2603
    producers:
      relay11:
        latency-ms: 10.0
        bandwidth-bytes-per-second: 694444
      relay12:
        latency-ms: 10.0
        bandwidth-bytes-per-second: 694444
      relay13:
        latency-ms: 10.0

# Pandoc settings for the PDF, after the Leios design document's recipe
# (docs/leios-design/metadata.yaml in the ouroboros-leios repository):
# the same class, page, margins and link colours. Section numbering is off
# because the headings carry their own numbers. The T1 font encoding of
# that recipe is left out: XeTeX sets the text in Unicode fonts and loses
# the curly quotes under it. Tables are set one size smaller than the text.
toc: true
toc-depth: 3
numbersections: false
highlight-style: haddock
documentclass: scrartcl
fontsize: 11pt
geometry:
  - margin=2.5cm
  - top=3cm
  - bottom=3cm
colorlinks: true
linkcolor: NavyBlue
urlcolor: NavyBlue
citecolor: NavyBlue
toccolor: black
papersize: a4
linestretch: 1.15
indent: false
header-includes: |
  \usepackage{microtype}
  \usepackage{etoolbox}
  \AtBeginEnvironment{longtable}{\small\renewcommand{\arraystretch}{1.3}}

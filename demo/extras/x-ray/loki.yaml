auth_enabled: false
limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  max_streams_per_user: 100000
  # The limit the "maximum active stream limit exceeded" 429 actually enforces
  # (default 5000). Streams are keyed per node by kind/ns/sev plus voterId on
  # cast votes, so a 500-voter committee sails past the default; alloy then
  # drops batches after retries and ingestion stalls behind the failing batch.
  max_global_streams_per_user: 100000
  # The 4 MB/s default turns any Alloy positions reset (crash-loop, pipeline
  # reload) into an hour of 429-throttled catch-up over the multi-GB node
  # logs. Steady state is well under 1 MB/s; this is headroom for re-reads.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_label_names_per_series: 20
  # Raised from the loki default of 500 as leiosCommitteeSize is 900 and the
  # voting dashboard returns a series per seat, or per rbHash on the EB panels.
  max_query_series: 2000
server:
  http_listen_port: 3100
  log_level: info
  grpc_server_max_send_msg_size: 16777216
  grpc_server_max_recv_msg_size: 16777216
common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: "${WORKING_DIR}/loki"
schema_config:
  configs:
    - from: 2020-05-15
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  tsdb_shipper:
    active_index_directory: "${WORKING_DIR}/loki/index"
    cache_location: "${WORKING_DIR}/loki/index_cache"
  filesystem:
    directory: "${WORKING_DIR}/loki/chunks"
pattern_ingester:
  enabled: true

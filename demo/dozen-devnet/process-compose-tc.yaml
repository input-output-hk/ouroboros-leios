# Traffic control overlay for process-compose.yaml
#
# Only the namespace setup lives here. The node processes themselves are
# generated by run.sh into ${WORKING_DIR}/process-compose-nodes.yaml, already
# wrapped in `ip netns exec` and depending on InitNamespaces when TC=1.
#
# NOTE: Elevated processes (is_elevated: true) run via sudo, which does not
# preserve environment variables. We must explicitly pass needed variables
# inline in the command for them to be available in elevated scripts.

version: "0.5"

processes:
  InitNamespaces:
    is_elevated: true
    command: |
      NS_PREFIX="${NS_PREFIX}" \
      NODE_SPEC="${NODE_SPEC}" \
      IP_HOST="${IP_HOST}" \
      RATE="${RATE}" \
      DELAY="${DELAY}" \
      bash "${SOURCE_DIR}/scripts/init-namespaces.sh"

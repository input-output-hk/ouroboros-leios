Protocol: Cardano
ByronGenesisFile: byron-genesis.json
ShelleyGenesisFile: shelley-genesis.json
AlonzoGenesisFile: alonzo-genesis.json
ConwayGenesisFile: conway-genesis.json
DijkstraGenesisFile: dijkstra-genesis.json

# Offer endorser blocks to peers once they are this many slots past the
# immutable tip. The default (3600) is tuned for mainnet and would keep a young
# devnet from ever certifying.
LeiosMinOfferLead: 30

EnableP2P: true

# Experimental features of this release, all of which should be on.
#
# Egress scheduler: serves local roots and large pools' relays first under
# load, within this bandwidth budget. 0 turns it off.
EgressBudgetMbps: 250

# Newer transaction submission between nodes (the default is V1).
TxSubmissionLogicVersion: TxSubmissionLogicV2

# Adaptive endorsements: block producers forge smaller endorser blocks after
# announcements miss their quorum, and grow them back while quorums are made.
# Each miss scales the capacity by Decrease, each quorum made adds Increase
# back, and MinScale is the floor. Watch it on the Adaptive endorsements
# dashboard panel.
LeiosAdaptiveEndorsements:
  Enabled: true
  Decrease: 0.8
  Increase: 0.02
  MinScale: 0.1

# Keep the endorser block databases next to, not inside, the chain database.
LeiosDbConfig:
  Backend: SQLite
  VolatileFilepath: "../leios.vol.db"
  ImmutableFilepath: "../leios.imm.db"

LastKnownBlockVersion-Alt: 0
LastKnownBlockVersion-Major: 3
LastKnownBlockVersion-Minor: 1
ConsensusMode: GenesisMode
RequiresNetworkMagic: RequiresMagic
LedgerDB:
  # Keep the UTxO set on disk, which makes ledger access more demanding.
  # V2InMemory keeps it in RAM instead.
  Backend: V2LSM
  NumOfDiskSnapshots: 2
  QueryBatchSize: 100000
  SnapshotInterval: 4230
PeerSharing: false
SyncTargetNumberOfActivePeers: 15
SyncTargetNumberOfEstablishedPeers: 40
TargetNumberOfActivePeers: 15
TargetNumberOfEstablishedPeers: 40

ExperimentalProtocolsEnabled: true
ExperimentalHardForksEnabled: true
TestShelleyHardForkAtEpoch: 0
TestAllegraHardForkAtEpoch: 0
TestMaryHardForkAtEpoch: 0
TestAlonzoHardForkAtEpoch: 0
TestBabbageHardForkAtEpoch: 0
TestConwayHardForkAtEpoch: 0
TestDijkstraHardForkAtEpoch: 0

TurnOnLogMetrics: true
TurnOnLogging: true
UseTraceDispatcher: true
TraceOptionNodeName: node0
TraceOptionMetricsPrefix: cardano.node.metrics.
TraceOptionForwarder:
  connQueueSize: 64
  disconnQueueSize: 128
  maxReconnectDelay: 30
TraceOptionPeerFrequency: 2000
TraceOptionResourceFrequency: 1000
TraceOptions:
  '':
    backends:
    - Stdout MachineFormat
    - PrometheusSimple 0.0.0.0 12900
    detail: DNormal
    severity: Notice
  BlockFetch.Client:
    severity: Debug
  BlockFetch.Client.CompletedBlockFetch:
    maxFrequency: 2.0
  BlockFetch.Decision:
    severity: Notice
  BlockFetch.Remote:
    severity: Notice
  BlockFetch.Remote.Serialised:
    severity: Notice
  BlockFetch.Server:
    severity: Debug
  BlockchainTime:
    severity: Notice
  ChainDB:
    severity: Debug
  ChainDB.AddBlockEvent.AddBlockValidation:
    severity: Debug
  ChainDB.AddBlockEvent.AddBlockValidation.ValidCandidate:
    maxFrequency: 2.0
  ChainDB.AddBlockEvent.AddedBlockToQueue:
    maxFrequency: 2.0
  ChainDB.AddBlockEvent.AddedBlockToVolatileDB:
    maxFrequency: 2.0
  # The trace verifier's Praos layer needs the headers these list at DDetailed.
  ChainDB.AddBlockEvent.AddedToCurrentChain:
    detail: DDetailed
  ChainDB.AddBlockEvent.SwitchedToAFork:
    detail: DDetailed
  ChainDB.CopyToImmutableDBEvent.CopiedBlockToImmutableDB:
    maxFrequency: 2.0
  # Very noisy and not used by the dashboards.
  ChainDB.LedgerEvent:
    severity: Silence
  ChainDB.ReplayBlock.LedgerReplay:
    severity: Notice
  ChainSync.Client:
    severity: Debug
  ChainSync.Local:
    severity: Silence
  ChainSync.Remote:
    severity: Notice
  ChainSync.Remote.Serialised:
    severity: Notice
  ChainSync.ServerBlock:
    severity: Notice
  ChainSync.ServerHeader:
    severity: Debug
  Consensus.GSM:
    severity: Info
  Forge.Loop:
    severity: Debug
  Forge.StateInfo:
    severity: Debug
  LedgerMetrics:
    severity: Info
  LeiosMetrics:
    severity: Info
  Mempool:
    severity: Debug
  Mempool.AttemptAdd:
    severity: Silence
  Mempool.LedgerFound:
    severity: Debug
  Mempool.LedgerNotFound:
    severity: Debug
  Mempool.SyncNotNeeded:
    severity: Debug
  Mempool.Synced:
    severity: Debug
  Net:
    severity: Notice
  Net.AcceptPolicy:
    severity: Debug
  Net.ConnectionManager.Local:
    severity: Silence
  Net.ConnectionManager.Remote:
    severity: Debug
  Net.ConnectionManager.Remote.ConnectionManagerCounters:
    severity: Silence
  Net.DNSResolver:
    severity: Notice
  Net.ErrorPolicy:
    severity: Info
  Net.ErrorPolicy.Local:
    severity: Debug
  Net.ErrorPolicy.Remote:
    severity: Debug
  Net.Handshake.Local:
    severity: Silence
  Net.Handshake.Remote:
    severity: Debug
  Net.InboundGovernor:
    severity: Warning
  Net.InboundGovernor.Local:
    severity: Silence
  Net.InboundGovernor.Remote:
    severity: Debug
  Net.InboundGovernor.Transition:
    severity: Debug
  Net.Mux.Local:
    severity: Silence
  Net.Mux.Remote:
    severity: Notice
  Net.PeerSelection:
    severity: Silence
  Net.PeerSelection.Actions:
    severity: Debug
  Net.PeerSelection.Counters:
    detail: DMinimal
    severity: Debug
  Net.PeerSelection.Initiator:
    severity: Notice
  Net.PeerSelection.Responder:
    severity: Notice
  Net.PeerSelection.Selection:
    severity: Debug
  Net.Peers.Ledger:
    severity: Debug
  Net.Peers.List:
    severity: Notice
  Net.Peers.LocalRoot:
    severity: Debug
  Net.Peers.PublicRoot:
    severity: Debug
  Net.Server.Local:
    severity: Silence
  Net.Server.Remote:
    severity: Debug
  Net.Subscription.DNS:
    severity: Debug
  Net.Subscription.IP:
    severity: Debug
  NodeState:
    severity: Notice
  Resources:
    severity: Silence
  Shutdown:
    severity: Notice
  Startup:
    severity: Notice
  Startup.DiffusionInit:
    severity: Debug
  StateQueryServer:
    severity: Notice
  TxSubmission.Local:
    severity: Silence
  TxSubmission.LocalServer:
    severity: Silence
  TxSubmission.MonitorClient:
    severity: Notice
  TxSubmission.Remote:
    severity: Notice
  TxSubmission.TxInbound:
    severity: Debug
  # The following are very noisy at high throughput; raise them to Debug only
  # for a diagnostic run.
  TxSubmission.TxInbound.CanRequestMoreTxs:
    severity: Silence
  TxSubmission.TxInbound.CannotRequestMoreTxs:
    severity: Silence
  TxSubmission.TxInbound.Processed:
    severity: Silence
  TxSubmission.TxInbound.Collected:
    severity: Silence
  TxSubmission.TxInbound.RequestTxs:
    severity: Silence
  TxSubmission.TxInbound.AddedToMempool:
    severity: Silence
  TxSubmission.TxOutbound:
    severity: Notice
  Version.NodeVersion:
    severity: Info
  LeiosNotify.Remote:
    severity: Debug
    maxFrequency: 0
  LeiosFetch.Remote:
    severity: Debug
    maxFrequency: 0
  Consensus.LeiosKernel:
    severity: Debug
    maxFrequency: 0
  Consensus.LeiosPeer:
    severity: Debug
    maxFrequency: 0

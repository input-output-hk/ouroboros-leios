Protocol: Cardano
ByronGenesisFile: byron-genesis.json
ShelleyGenesisFile: shelley-genesis.json
AlonzoGenesisFile: alonzo-genesis.json
ConwayGenesisFile: conway-genesis.json
DijkstraGenesisFile: dijkstra-genesis.json

# Lower bound, 2 * maxEBClosure (12.5MB)
MempoolCapacityBytesOverride: 25000000

# Sledgehammer: passes Nothing to consensus for the whole MempoolTimeoutConfig,
# switching off all three at once — the per-tx soft timeout (discard), the per-tx
# hard timeout (disconnect the peer) and the cumulative validation-time capacity.
# They share one Maybe in consensus, so there is no finer-grained off-switch.
#
# The capacity is the one we are actually after: it was admitting 34,416 txs on
# an idle box (5 s budget / 145 us per tx) while the byte capacity sat at 32%,
# and it is excluded from the capacity the node reports. With it off, the byte
# dimension binds instead — 25 MB / 228 B is about 107k txs, so expect mempools
# roughly three times deeper.
#
# Set to true to restore the defaults (1 s / 1.5 s / 5 s).
MempoolTimeoutsEnabled: false

# Needed < 10.6
EnableP2P: true

# Node-to-node tx-submission inbound logic. V2 is the newer pull/decision-based
# logic; V1 is the legacy path. Switch to compare N2N propagation throughput
# under real traffic delays (default is TxSubmissionLogicV1).
TxSubmissionLogicVersion: TxSubmissionLogicV2

LastKnownBlockVersion-Alt: 0
LastKnownBlockVersion-Major: 3
LastKnownBlockVersion-Minor: 1
ConsensusMode: GenesisMode
RequiresNetworkMagic: RequiresMagic
LedgerDB:
  # On-disk UTxO-HD backend (LSM-tree backing store) so UTxO reads/writes hit
  # disk — makes ledger access demanding, as wanted for mempool throughput
  # baselining. Switch back to V2InMemory to keep the UTxO set in RAM.
  Backend: V2LSM
  NumOfDiskSnapshots: 2
  QueryBatchSize: 100000
  SnapshotInterval: 4230
PeerSharing: false
SyncTargetNumberOfActivePeers: 15
SyncTargetNumberOfEstablishedPeers: 40
TargetNumberOfActivePeers: 15
TargetNumberOfEstablishedPeers: 40

ExperimentalProtocolsEnabled: true
ExperimentalHardForksEnabled: true
TestShelleyHardForkAtEpoch: 0
TestAllegraHardForkAtEpoch: 0
TestMaryHardForkAtEpoch: 0
TestAlonzoHardForkAtEpoch: 0
TestBabbageHardForkAtEpoch: 0
TestConwayHardForkAtEpoch: 0
TestDijkstraHardForkAtEpoch: 0

TurnOnLogMetrics: true
TurnOnLogging: true
UseTraceDispatcher: true
TraceOptionNodeName: node0
TraceOptionMetricsPrefix: cardano.node.metrics.
TraceOptionForwarder:
  connQueueSize: 64
  disconnQueueSize: 128
  maxReconnectDelay: 30
TraceOptionPeerFrequency: 2000
TraceOptionResourceFrequency: 1000
TraceOptions:
  '':
    backends:
    - Stdout MachineFormat
    - PrometheusSimple 0.0.0.0 12900
    detail: DNormal
    severity: Notice
  BlockFetch.Client:
    severity: Debug
  BlockFetch.Client.CompletedBlockFetch:
    maxFrequency: 2.0
  BlockFetch.Decision:
    severity: Notice
  BlockFetch.Remote:
    severity: Notice
  BlockFetch.Remote.Serialised:
    severity: Notice
  BlockFetch.Server:
    severity: Debug
  BlockchainTime:
    severity: Notice
  ChainDB:
    severity: Debug
  ChainDB.AddBlockEvent.AddBlockValidation:
    severity: Debug
  ChainDB.AddBlockEvent.AddBlockValidation.ValidCandidate:
    maxFrequency: 2.0
  ChainDB.AddBlockEvent.AddedBlockToQueue:
    maxFrequency: 2.0
  ChainDB.AddBlockEvent.AddedBlockToVolatileDB:
    maxFrequency: 2.0
  ChainDB.CopyToImmutableDBEvent.CopiedBlockToImmutableDB:
    maxFrequency: 2.0
  ChainDB.LedgerEvent.Flavor.V1.OnDisk.BackingStoreEvent:
    severity: Silence
  # One trace per UTxO read. Together these were over 40% of all log lines and
  # ~250 MB per node in twelve minutes, which makes the tracer itself a
  # suspect in the very stalls we are measuring. The handle
  # Create/Duplicate/Close traces are kept — they are low volume and are what
  # shows forker churn.
  ChainDB.LedgerEvent.Flavor.V2.LedgerTablesHandleRead:
    severity: Silence
  ChainDB.LedgerEvent.Flavor.V2.BackendTrace.LSM.LSMLookup:
    severity: Silence
  ChainDB.LedgerEvent.Flavor.V2.BackendTrace.LSM.LSMTrace:
    severity: Silence
  ChainDB.LedgerEvent.Forker:
    severity: Silence
  ChainDB.ReplayBlock.LedgerReplay:
    severity: Notice
  ChainSync.Client:
    severity: Debug
  ChainSync.Local:
    severity: Silence
  ChainSync.Remote:
    severity: Notice
  ChainSync.Remote.Serialised:
    severity: Notice
  ChainSync.ServerBlock:
    severity: Notice
  ChainSync.ServerHeader:
    severity: Debug
  Consensus.GSM:
    severity: Info
  Forge.Loop:
    severity: Debug
  Forge.StateInfo:
    severity: Debug
  LedgerMetrics:
    severity: Info
  # The whole mempool add path is traced here, on purpose: a stalled add shows
  # up as an AttemptAdd with no matching AddedTx, and a LedgerNotFound storm
  # tells us the mempool is failing to acquire the ledger state it wants rather
  # than doing slow work. Silencing these is what made the long stalls opaque.
  Mempool:
    severity: Debug
  # Silenced again now that it has done its job: it confirmed the stalls are
  # slow work rather than a LedgerNotFound retry storm, and at hundreds of
  # tx/s it is pure volume.
  Mempool.AttemptAdd:
    severity: Silence
  Mempool.LedgerFound:
    severity: Debug
  Mempool.LedgerNotFound:
    severity: Debug
  Mempool.SyncNotNeeded:
    severity: Debug
  Mempool.Synced:
    severity: Debug
  Net:
    severity: Notice
  Net.AcceptPolicy:
    severity: Debug
  Net.ConnectionManager.Local:
    severity: Silence
  Net.ConnectionManager.Remote:
    severity: Debug
  Net.ConnectionManager.Remote.ConnectionManagerCounters:
    severity: Silence
  Net.DNSResolver:
    severity: Notice
  Net.ErrorPolicy:
    severity: Info
  Net.ErrorPolicy.Local:
    severity: Debug
  Net.ErrorPolicy.Remote:
    severity: Debug
  Net.Handshake.Local:
    severity: Silence
  Net.Handshake.Remote:
    severity: Debug
  Net.InboundGovernor:
    severity: Warning
  Net.InboundGovernor.Local:
    severity: Silence
  Net.InboundGovernor.Remote:
    severity: Debug
  Net.InboundGovernor.Transition:
    severity: Debug
  Net.Mux.Local:
    severity: Silence
  Net.Mux.Remote:
    severity: Notice
  Net.PeerSelection:
    severity: Silence
  Net.PeerSelection.Actions:
    severity: Debug
  Net.PeerSelection.Counters:
    detail: DMinimal
    severity: Debug
  Net.PeerSelection.Initiator:
    severity: Notice
  Net.PeerSelection.Responder:
    severity: Notice
  Net.PeerSelection.Selection:
    severity: Debug
  Net.Peers.Ledger:
    severity: Debug
  Net.Peers.List:
    severity: Notice
  Net.Peers.LocalRoot:
    severity: Debug
  Net.Peers.PublicRoot:
    severity: Debug
  Net.Server.Local:
    severity: Silence
  Net.Server.Remote:
    severity: Debug
  Net.Subscription.DNS:
    severity: Debug
  Net.Subscription.IP:
    severity: Debug
  NodeState:
    severity: Notice
  Resources:
    severity: Silence
  Shutdown:
    severity: Notice
  Startup:
    severity: Notice
  Startup.DiffusionInit:
    severity: Debug
  StateQueryServer:
    severity: Notice
  TxSubmission.Local:
    severity: Silence
  TxSubmission.LocalServer:
    severity: Silence
  TxSubmission.MonitorClient:
    severity: Notice
  TxSubmission.Remote:
    severity: Notice
  TxSubmission.TxInbound:
    severity: Debug
  # These two fire once per decision-loop iteration and were half of all log
  # lines at 330 tx/s — 12 MB/s across twelve nodes, enough JSON encoding to
  # make the tracer a load source in its own right. They only ever told us a
  # ratio; raise them to Debug for a diagnostic run, not a throughput one.
  TxSubmission.TxInbound.CanRequestMoreTxs:
    severity: Silence
  TxSubmission.TxInbound.CannotRequestMoreTxs:
    severity: Silence
  # Per-tx bookkeeping, four lines for every transaction pulled from a peer, and
  # all of it is already available: Mempool.AddedTx covers the adds and the
  # txSubmission_* metrics cover the accept/request counts. Every node line is
  # parsed three times over by the Alloy chain (node -> voting -> call-trace),
  # so line count is what a saturated collector actually costs.
  TxSubmission.TxInbound.Processed:
    severity: Silence
  TxSubmission.TxInbound.Collected:
    severity: Silence
  TxSubmission.TxInbound.RequestTxs:
    severity: Silence
  TxSubmission.TxInbound.AddedToMempool:
    severity: Silence
  TxSubmission.TxOutbound:
    severity: Notice
  Version.NodeVersion:
    severity: Info
  LeiosNotify.Remote:
    severity: Debug
    maxFrequency: 0
  LeiosFetch.Remote:
    severity: Debug
    maxFrequency: 0
  Consensus.LeiosKernel:
    severity: Debug
    maxFrequency: 0
  Consensus.LeiosPeer:
    severity: Debug
    maxFrequency: 0

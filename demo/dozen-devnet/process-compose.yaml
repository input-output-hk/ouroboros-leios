version: "0.5"
is_strict: true

# The twelve node processes are generated into
# ${WORKING_DIR}/process-compose-nodes.yaml by run.sh, which passes it as a
# second -f. Everything that is not a node lives here.

processes:
  # Load is submitted to relays, not to block producers — that is where it
  # arrives on a real network, and it means every tx has to cross the relay mesh
  # before any pool can put it in a block.
  TxFirehose1:
    working_dir: ${WORKING_DIR}
    command: >
      ${TX_FIREHOSE:-tx-firehose}
      --socket-path relay11/node.socket
      --testnet-magic 164
      --signing-key-file ${SHARED_CONFIG_DIR}/stake-delegators/delegator1/payment.skey
      --staking-key-file ${SHARED_CONFIG_DIR}/stake-delegators/delegator1/staking.skey
      --tps ${TPS}
      --outputs-per-tx ${OUTPUTS}
      --color ${COLOR1}
      --fee 1000000
    log_location: "${WORKING_DIR}/tx-firehose1.log"
    depends_on:
      relay11:
        condition: process_healthy
    availability:
      restart: always
      # Wait between restarts so the mempool has time to clear a
      # descendant tx from a prior tx-firehose incarnation that would
      # otherwise cause every fresh submit to be rejected as
      # AllInputsAreSpent against the same head UTxO.
      backoff_seconds: 30

  # Second, on-demand load generator. `disabled: true` means it is defined but
  # not started automatically; start it from the process-compose TUI (select
  # it and press F7 / "start"), or from another shell with:
  #   process-compose process start TxFirehose2
  # It targets relay21 — a different block producer's relay group — with
  # delegator2's key, so neither the tx chain nor the entry point overlaps with
  # TxFirehose1 and the two never fight over the same UTxO.
  TxFirehose2:
    working_dir: ${WORKING_DIR}
    command: >
      ${TX_FIREHOSE:-tx-firehose}
      --socket-path relay21/node.socket
      --testnet-magic 164
      --signing-key-file ${SHARED_CONFIG_DIR}/stake-delegators/delegator2/payment.skey
      --staking-key-file ${SHARED_CONFIG_DIR}/stake-delegators/delegator2/staking.skey
      --tps ${TPS}
      --outputs-per-tx ${OUTPUTS}
      --color ${COLOR2}
      --fee 1000000
    log_location: "${WORKING_DIR}/tx-firehose2.log"
    depends_on:
      relay21:
        condition: process_healthy
    availability:
      restart: always
      backoff_seconds: 30

  # Third generator, giving bp3's relay group an origin too. Without it bp3 is
  # the only node with no injection point among its peers, and its mempool
  # ingest is capped at roughly one origin's worth of supply (measured: 260 tx/s
  # against 511-520 for the relays, which each peer with two origins).
  # delegator3's key, so its tx chain is independent of the other two.
  TxFirehose3:
    working_dir: ${WORKING_DIR}
    command: >
      ${TX_FIREHOSE:-tx-firehose}
      --socket-path relay31/node.socket
      --testnet-magic 164
      --signing-key-file ${SHARED_CONFIG_DIR}/stake-delegators/delegator3/payment.skey
      --staking-key-file ${SHARED_CONFIG_DIR}/stake-delegators/delegator3/staking.skey
      --tps ${TPS}
      --outputs-per-tx ${OUTPUTS}
      --color ${COLOR3}
      --fee 1000000
    log_location: "${WORKING_DIR}/tx-firehose3.log"
    depends_on:
      relay31:
        condition: process_healthy
    availability:
      restart: always
      backoff_seconds: 30

  # The 350-entry PlutusV3 cost model PlutusBench needs for its CPU and memory
  # dials (native multiScalarMul and replicateByte). A genesis can only carry
  # the 251-entry model, so it is enacted on chain, two epoch boundaries after
  # this starts. Runs on every start and does nothing once the model is there.
  EnactPlutusCostModel:
    working_dir: ${WORKING_DIR}
    command: >
      bash -c 'cardano-cli dijkstra query protocol-parameters
      | jq -e ".costModels.PlutusV3 | length == 350" >/dev/null
      || bash "${SOURCE_DIR}/propose-pparam-update.sh" --no-spo-votes
      --cli-arg "--cost-model-file ${PLUTUS_BENCH_COST_MODELS}"'
    environment:
      - CARDANO_NODE_NETWORK_ID=164
      - CARDANO_NODE_SOCKET_PATH=${WORKING_DIR}/bp1/node.socket
      - WORK=${WORKING_DIR}/plutus-cost-model
      - ANCHOR_PORT=8098
    log_location: "${WORKING_DIR}/enact-plutus-cost-model.log"
    depends_on:
      bp1:
        condition: process_healthy

  # Worst-case Plutus V3 load from plutus-network-bench, on demand like
  # TxFirehose2: start it from the TUI or with
  #   process-compose process start PlutusBench
  # It waits for EnactPlutusCostModel, then sets up its fixtures and calibrates
  # once before submitting PLUTUS_TPS txs per second, each saturating the per-tx
  # execution budget. Submits to relay21 with its own funded key (utxo2).
  PlutusBench:
    disabled: true
    working_dir: ${WORKING_DIR}
    command: bash "${SHARED_CONFIG_DIR}/plutus-bench/run.sh"
    environment:
      - SOCKET=${WORKING_DIR}/relay21/node.socket
      - SKEY=${SHARED_CONFIG_DIR}/utxo-keys/utxo2/utxo.skey
      - STATE_ROOT=${WORKING_DIR}/plutus-bench
      - TPS=${PLUTUS_TPS}
    log_location: "${WORKING_DIR}/plutus-bench.log"
    depends_on:
      relay21:
        condition: process_healthy
    availability:
      restart: on_failure
      backoff_seconds: 30

  # A block producer and one relay, to see whether the two ends of the network
  # agree. The remaining ten nodes are on the Grafana dashboards.
  ObserveTipBp1:
    environment:
      - CARDANO_NODE_NETWORK_ID=164
      - CARDANO_NODE_SOCKET_PATH=${WORKING_DIR}/bp1/node.socket
    command: watch -n1 "cardano-cli query tip && cardano-cli query tx-mempool info"
    is_interactive: true
    depends_on:
      bp1:
        condition: process_started

  ObserveTipRelay11:
    environment:
      - CARDANO_NODE_NETWORK_ID=164
      - CARDANO_NODE_SOCKET_PATH=${WORKING_DIR}/relay11/node.socket
    command: watch -n1 "cardano-cli query tip && cardano-cli query tx-mempool info"
    is_interactive: true
    depends_on:
      relay11:
        condition: process_started
